<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">河並研究室の研究領域を表すイラスト</title>
  <desc id="desc">センサ、ネットワーク、歩行解析、教育、ドローンを組み合わせた研究室のイメージ図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b4f9c" />
      <stop offset="100%" stop-color="#1e86d8" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f4f9ff" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)" />
  <g opacity="0.18" fill="#ffffff">
    <circle cx="180" cy="120" r="70" />
    <circle cx="1030" cy="145" r="95" />
    <circle cx="950" cy="680" r="120" />
  </g>
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="1060" height="660" rx="32" fill="url(#card)" />
    <text x="60" y="85" font-size="42" font-family="'Yu Gothic', sans-serif" fill="#083b73" font-weight="700">Kawanami Laboratory</text>
    <text x="60" y="125" font-size="24" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">IoT ・ センサ ・ AI ・ モーション解析 ・ 教育技術</text>

    <!-- central hub -->
    <circle cx="520" cy="340" r="88" fill="#0f5ead" />
    <circle cx="520" cy="340" r="65" fill="#ffffff" />
    <path d="M487 347c18-57 66-95 95-95 3 34-15 73-51 102" fill="none" stroke="#0f5ead" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 365c24-4 53 0 78 16" fill="none" stroke="#f0a31a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="520" cy="340" r="9" fill="#0f5ead" />

    <!-- nodes -->
    <g stroke="#79aee3" stroke-width="5" fill="none">
      <path d="M520 252 L520 155" />
      <path d="M590 285 L704 205" />
      <path d="M603 359 L742 375" />
      <path d="M545 410 L620 515" />
      <path d="M452 407 L335 531" />
      <path d="M436 321 L284 310" />
      <path d="M460 272 L350 178" />
    </g>

    <!-- motion analysis card -->
    <g transform="translate(420,40)">
      <rect width="220" height="110" rx="22" fill="#ffffff" stroke="#d7e6f3" />
      <text x="24" y="34" font-size="21" font-family="'Yu Gothic', sans-serif" fill="#0f5ead" font-weight="700">運動解析</text>
      <text x="24" y="62" font-size="15" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">歩容・姿勢・スポーツ</text>
      <circle cx="168" cy="47" r="11" fill="#0f5ead" />
      <path d="M168 60 L168 82 M168 69 L150 88 M168 69 L186 88 M168 82 L152 100 M168 82 L185 102" stroke="#0f5ead" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- sensor network -->
    <g transform="translate(720,150)">
      <rect width="220" height="110" rx="22" fill="#ffffff" stroke="#d7e6f3" />
      <text x="24" y="34" font-size="21" font-family="'Yu Gothic', sans-serif" fill="#0f5ead" font-weight="700">センサネットワーク</text>
      <text x="24" y="62" font-size="15" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">IoT・省電力通信</text>
      <g transform="translate(142,27)" fill="#f0a31a" stroke="#0f5ead" stroke-width="4">
        <circle cx="20" cy="12" r="8" />
        <circle cx="58" cy="12" r="8" />
        <circle cx="39" cy="42" r="8" />
        <line x1="20" y1="12" x2="58" y2="12" />
        <line x1="20" y1="12" x2="39" y2="42" />
        <line x1="58" y1="12" x2="39" y2="42" />
      </g>
    </g>

    <!-- education -->
    <g transform="translate(760,322)">
      <rect width="220" height="110" rx="22" fill="#ffffff" stroke="#d7e6f3" />
      <text x="24" y="34" font-size="21" font-family="'Yu Gothic', sans-serif" fill="#0f5ead" font-weight="700">STEAM教材</text>
      <text x="24" y="62" font-size="15" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">micro:bit・AI・ドローン</text>
      <g transform="translate(150,22)">
        <rect x="0" y="4" width="48" height="40" rx="7" fill="#0f5ead" />
        <circle cx="14" cy="18" r="4" fill="#f4f9ff" />
        <circle cx="34" cy="18" r="4" fill="#f4f9ff" />
        <rect x="8" y="52" width="12" height="12" rx="2" fill="#f0a31a" />
        <rect x="24" y="52" width="12" height="12" rx="2" fill="#79aee3" />
        <rect x="40" y="52" width="12" height="12" rx="2" fill="#0f5ead" />
      </g>
    </g>

    <!-- drone -->
    <g transform="translate(500,500)">
      <rect width="220" height="110" rx="22" fill="#ffffff" stroke="#d7e6f3" />
      <text x="24" y="34" font-size="21" font-family="'Yu Gothic', sans-serif" fill="#0f5ead" font-weight="700">ドローン制御</text>
      <text x="24" y="62" font-size="15" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">外部認識・安全飛行支援</text>
      <g transform="translate(146,26)" fill="none" stroke="#0f5ead" stroke-width="4" stroke-linecap="round">
        <circle cx="18" cy="14" r="10" />
        <circle cx="58" cy="14" r="10" />
        <circle cx="18" cy="48" r="10" />
        <circle cx="58" cy="48" r="10" />
        <line x1="28" y1="14" x2="48" y2="14" />
        <line x1="28" y1="48" x2="48" y2="48" />
        <line x1="18" y1="24" x2="18" y2="38" />
        <line x1="58" y1="24" x2="58" y2="38" />
        <rect x="27" y="24" width="22" height="14" rx="4" fill="#f0a31a" stroke="#f0a31a" />
      </g>
    </g>

    <!-- esports and biosignal -->
    <g transform="translate(160,470)">
      <rect width="240" height="118" rx="22" fill="#ffffff" stroke="#d7e6f3" />
      <text x="24" y="34" font-size="21" font-family="'Yu Gothic', sans-serif" fill="#0f5ead" font-weight="700">生体・行動データ解析</text>
      <text x="24" y="62" font-size="15" font-family="'Yu Gothic', sans-serif" fill="#5c6b7a">eSports・健康・認証</text>
      <path d="M160 80c12-22 26-22 38 0 12-22 26-22 38 0" fill="none" stroke="#f0a31a" stroke-width="5" stroke-linecap="round" />
      <path d="M155 80h10l7-16 12 33 10-21h8" fill="none" stroke="#0f5ead" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- bottom labels -->
    <text x="60" y="600" font-size="20" font-family="'Yu Gothic', sans-serif" fill="#083b73" font-weight="700">実世界のデータを扱い、計測・分析・実装・評価まで一貫して取り組む研究室</text>
    <text x="60" y="635" font-size="16" font-family="'Yu Gothic', sans-serif" fill="#516475">ウェアラブルセンシング / 歩容解析 / センサネットワーク / ドローン / STEAM教育 / eSports</text>
  </g>
</svg>
