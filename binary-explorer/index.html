/* Waveform editing: the bytes describe a single cycle; pitch has its own control. */
.sample-controls { display: flex; gap: 18px; flex-wrap: wrap; }
.sample-controls > div { flex: 1; min-width: 130px; }
.sample-controls .text-input { width: 100%; font-size: 18px; }
.frequency-control { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.frequency-control .text-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.frequency-control output { font: 600 22px var(--mono); color: var(--green); }
.frequency-control input[type=range] { width: 100%; min-height: 34px; margin: 2px 0; accent-color: var(--green); cursor: pointer; }
.range-labels { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
#frequency-hint { font-size: 12px; color: var(--muted); margin-bottom: 0; }
.editable-waveform { touch-action: none; cursor: crosshair; aspect-ratio: 800 / 360; background: #fff; border: 1px solid var(--line); }
.wave-help { font-size: 12px; color: var(--muted); text-align: center; margin: 12px 0; }
.sample-readout { font-size: 15px; color: var(--ink); background: #eef5f0; border-radius: 6px; padding: 10px 14px; text-align: center; }
.audio-experiment .wave-heading > span { font-size: 12px; color: var(--muted); }
.audio-experiment .play { margin-top: 20px; }
.audio-experiment .result-content { justify-content: flex-start; }
@media (min-width: 761px) and (max-height: 850px) {
  .audio-experiment .pane-description { margin: 8px 0; }
  .audio-experiment .controls { margin-bottom: 12px; }
  .audio-experiment .extra { margin-top: 14px; }
  .audio-experiment .audio-explanation { margin: 10px 0; }
  .audio-experiment .frequency-control { margin-top: 12px; padding-top: 12px; }
  .audio-experiment #frequency-hint { margin-top: 6px; }
  .audio-experiment .wave-heading { margin: 14px 0 10px; }
  .audio-experiment .waveform { max-height: 225px; }
  .audio-experiment .wave-help { margin: 9px 0; }
  .audio-experiment .play { margin-top: 14px; }
  .audio-experiment .sample-readout { padding: 8px 12px; }
}
@media (max-width: 420px) {
  .sample-controls { gap: 10px; }
  .sample-controls .text-label span { display: block; margin: 0; }
  .wave-help { font-size: 11px; }
  .sample-readout { font-size: 13px; }
}

.picture-presets { margin-top: 20px; width: min(100%, 340px); }
.picture-presets .choices { gap: 8px; }
.picture-presets .choice { flex: 1; }
.sixteen-pixels .pixel { padding: 5px; }
.sixteen-pixels .pixel span { font-size: 10px; padding: 3px 4px; }

.lab-label { padding: 20px 0 16px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: 2px; }
.classroom .lab-label { display: none; }
.ascii-reference { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; background: white; overflow: hidden; }
.ascii-reference summary { padding: 17px 22px; cursor: pointer; font-weight: 700; font-size: 15px; }
.ascii-reference summary span { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 14px; }
.ascii-reference summary:focus-visible, .ascii-table-scroll:focus-visible { outline: 3px solid #b56e00; outline-offset: -3px; }
.ascii-table-note { margin: 0; padding: 0 22px 16px; font-size: 13px; color: var(--muted); }
.ascii-table-scroll { max-height: 480px; overflow: auto; padding: 0 20px 20px; }
.ascii-tables { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.ascii-tables table { border-collapse: collapse; width: 100%; font-size: 13px; }
.ascii-tables caption { padding: 10px; font-weight: 700; text-align: left; color: var(--green); }
.ascii-tables th, .ascii-tables td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: center; }
.ascii-tables thead { background: #eef5f0; }
.ascii-tables tbody th { font-family: var(--mono); font-weight: 400; }
.ascii-binary { font-family: var(--mono); white-space: nowrap; }
.ascii-tables .current-code { background: #e4f2e9; outline: 2px solid var(--green); outline-offset: -2px; }
.ascii-tables .current-code th, .ascii-tables .current-code td { font-weight: 700; }
@media (max-width: 1100px) { .ascii-tables { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .ascii-tables { grid-template-columns: minmax(0, 1fr); }
  .ascii-reference summary span { display: block; margin: 6px 0 0; }
}

<script>
(() => {
'use strict';
const modules = Object.create(null);
modules["src/core/binary.js"] = (() => {
function assertByte(value) {
  if (!Number.isInteger(value) || value < 0 || value > 255) throw new RangeError('0〜255の整数を指定してください。');
  return value;
}
function byteToBits(value) { return assertByte(value).toString(2).padStart(8, '0').split('').map(Number); }
function bitsToByte(bits) {
  if (!Array.isArray(bits) || bits.length !== 8 || bits.some(bit => bit !== 0 && bit !== 1)) throw new TypeError('8個の0または1が必要です。');
  return bits.reduce((value, bit) => value * 2 + bit, 0);
}
function toggleBit(value, position) {
  assertByte(value);
  if (!Number.isInteger(position) || position < 0 || position > 7) throw new RangeError('ビット番号は0〜7です。');
  return value ^ (1 << position);
}
function formatBinary(value) { const bits = byteToBits(value).join(''); return `${bits.slice(0, 4)} ${bits.slice(4)}`; }

return { assertByte, byteToBits, bitsToByte, toggleBit, formatBinary };
})();
modules["src/ui/bit-editor.js"] = (() => {
const { byteToBits, toggleBit, formatBinary } = modules["src/core/binary.js"];

function createBitEditor({ value, label, onChange }) {
  const element = document.createElement('div');
  element.className = 'byte-editor';
  element.innerHTML = `<div class="byte-heading"><strong></strong><span>8 bit / 1 byte</span></div><div class="bits" role="group"></div><div class="byte-details"><span>2進数 <b class="binary-value"></b></span><span>10進数 <b class="decimal-value"></b></span></div>`;
  element.querySelector('.byte-heading strong').textContent = label;
  const group = element.querySelector('.bits');
  group.setAttribute('aria-label', label);
  const timers = new Map();
  const buttons = byteToBits(value).map((bit, index) => {
    const cell = document.createElement('div'); cell.className = 'bit-cell';
    const caption = document.createElement('span'); caption.className = 'bit-position'; caption.textContent = 7 - index;
    const button = document.createElement('button'); button.type = 'button'; button.className = 'bit';
    cell.append(caption, button); group.append(cell);
    button.addEventListener('click', () => {
      value = toggleBit(value, 7 - index); update(value);
      clearTimeout(timers.get(button)); button.classList.add('changed');
      timers.set(button, setTimeout(() => button.classList.remove('changed'), 1500));
      onChange(value);
    });
    return button;
  });
  function update(next) {
    value = next;
    byteToBits(value).forEach((bit, index) => {
